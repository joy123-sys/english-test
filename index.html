<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PWA-мета-теги -->
    <meta name="theme-color" content="#3454b4">
    <meta name="description" content="Приложение для изучения HTML, CSS и JavaScript">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Тренажёр">
    
    <!-- Манифест -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Иконки -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <title>Тренажёр HTML, CSS & JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">

        <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
        <div id="menu-screen">
            <header>
                <h1>🎨 Тренажёр CSS & JS</h1>
                <p>Выберите категорию и тему для прохождения теста</p>
            </header>

            <div class="category-section">
                <button class="category-header" data-target="html-topics">
                    <span class="arrow">▶</span>
                    <span>HTML</span>
                </button>
                <div class="topic-list collapsed" id="html-topics"></div>
            </div>

            <div class="category-section">
                <button class="category-header" data-target="css-topics">
                    <span class="arrow">▶</span>
                    <span>CSS</span>
                </button>
                <div class="topic-list collapsed" id="css-topics"></div>
            </div>

            <div class="category-section">
                <button class="category-header" data-target="js-topics">
                    <span class="arrow">▶</span>
                    <span>JavaScript</span>
                </button>
                <div class="topic-list collapsed" id="js-topics"></div>
            </div>
        </div>

        <!-- ЭКРАН 2: ТЕСТ -->
        <div id="quiz-screen" class="hidden">
            <header>
                <button id="back-btn" class="back-btn">← Назад к темам</button>
                <h1 id="quiz-title"></h1>
                <p id="test-description"></p>
            </header>

            <main id="quiz-container"></main>

            <div class="actions">
                <button id="check-btn">Проверить ответы</button>
                <button id="reset-btn" style="display:none;">Пройти заново</button>
            </div>

            <div id="result-container" class="hidden">
                <h2>Результат</h2>
                <div id="score-display"></div>
                <div id="detailed-results"></div>
            </div>
        </div>

    </div>

    <!-- ============================================ -->
    <!-- ПОРЯДОК ПОДКЛЮЧЕНИЯ КРИТИЧЕСКИ ВАЖЕН!         -->
    <!-- ============================================ -->

    <!-- 1. Сначала — реестр, чтобы registerTest существовала -->
    <script src="registry.js"></script>

    <!-- 2. Потом — все файлы тестов -->
    <script src="tests/html/basics.js"></script>
    <script src="tests/html/formatting.js"></script>
    <script src="tests/html/forms-frames.js"></script>
    <script src="tests/html/media-links.js"></script>
    <script src="tests/html/semantics-tables.js"></script>

    <script src="tests/css/basics.js"></script>
    <script src="tests/css/text-font.js"></script>
    <script src="tests/css/box-model.js"></script>
    <script src="tests/css/position-display.js"></script>
    <script src="tests/css/flex-grid.js"></script>
    <script src="tests/css/animations.js"></script>

    <script src="tests/js/basics.js"></script>
    <script src="tests/js/arrays.js"></script>
    <script src="tests/js/functions.js"></script>

    <!-- 3. И только в конце — главный app.js -->
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ SW зарегистрирован'))
                    .catch(err => console.error('❌ Ошибка SW:', err));
            });
        }
    </script>
</body>
</html>
